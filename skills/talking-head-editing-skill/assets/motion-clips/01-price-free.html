<title>01 Price to free</title>
<style>
.pt{position:absolute;transform:translate(-50%,-50%);left:0;top:0;white-space:nowrap;font-weight:600;letter-spacing:-.02em}
</style>
<div data-slot="shape">
  <div class="L" id="Lprice">
    <div class="pt" id="ptxt" style="font-size:78px;color:#fff">₹10,000–15,000</div>
    <div class="a" id="strike" style="left:-330px;top:-3px;height:7px;border-radius:4px;background:#FF5A1F;width:0"></div>
  </div>
  <div class="L" id="Lfree">
    <div class="pt" style="font-size:104px;color:#fff;letter-spacing:-.03em">FREE</div>
  </div>
</div><!--/shape-->
<script>
const $=id=>document.getElementById(id);
const strike=M.track(0,[[0.95,660,M.FAST]]);
const dim=M.track(1,[[0.95,0.45,M.MORPH]]);
M.scene({
  W:1080,H:1920,T:2.8,bg:'#E9E7E2',center:[540,960],intro:0.05,
  SH:{
    price:{w:780,h:170,r:85,bg:'#0B0B0B',cam:1.3},
    free:{w:520,h:210,r:105,bg:'#FF5A1F',cam:1.7},
  },
  start:'price', SEQ:[[1.45,'free']],
  layers:[
    {el:'Lprice',tin:0.05,tout:1.45,update:(t)=>{
      $('strike').style.width=Math.max(0,strike(t)).toFixed(1)+'px';
      $('ptxt').style.opacity=dim(t).toFixed(3);
    }},
    {el:'Lfree',tin:1.45,tout:null},
  ],
  cursor:{size:44,clicks:[0.95,1.45],keys:[[0,330,260],[0.7,200,40],[0.95,200,40],[1.2,160,50],[1.45,160,50]]},
});
</script>
